[project]
name = "cloverproof-data-sources"
version = "0.1.0"
description = "CloverProof open-data sources (offline caches). Separate from the pure engine; does I/O."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "rasterio>=1.4",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "data_sources"
