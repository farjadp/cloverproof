  crop: wheat
  target_yield_t_ha: 5.3
  previous_crop: canola
  area_ha: 40.0
  plan_date: "2027-02-15"
  soil_test: null
expected:
  n_rate_kg_ha: 148.75
  n_total_kg: 5950.0
  split_rates_kg_ha: [59.5, 89.25]
  split_timing_windows:
    - "At or before seeding (PLACEHOLDER timing)"
    - "Tillering to start of stem elongation (PLACEHOLDER timing)"
  confidence: low
  pk_note: PK_SOIL_TEST_RECOMMENDED
  reason: SAMPLE derived from the placeholder pack; not an agronomist decision.
