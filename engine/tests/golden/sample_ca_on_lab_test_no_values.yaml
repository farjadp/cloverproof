# SAMPLE golden case - NOT agronomist-approved. SYNTHETIC soil values.
# N side worked out by hand from packs/ca-on/v2.yaml (PLACEHOLDER constants): yield
# 6.5 t/ha, price ratio 5.5, after corn -> 115.0 kg N/ha; 20 ha -> 2300 kg N.
# A lab test with no values is no soil test: same N and the same confidence rules as
# having no test at all (C1 fires, so the no-test cap cannot be escaped).
id: sample_ca_on_lab_test_no_values
kind: sample  # not agronomist-approved; never counts toward the agreement gate
description: Lab test record with no values. Treated as no soil test; C1 fires.
pack:
  id: ca-on
  version: v2
# TODO(agronomist): set agreement tolerances for real cases.
tolerance:
  kg_n_per_ha: 0.5
  kg_n: 10
  kg_pk_per_ha: 0.01
  kg_pk: 0.1
  mg_pk_per_kg: 0.01
input:
  crop: wheat
  target_yield_t_ha: 6.5
  previous_crop: corn
  area_ha: 20.0
  plan_date: "2027-03-15"
  n_price:
    n_price_per_kg_n: 1.375
    grain_price_per_kg: 0.25
    currency: CAD
    source: SAMPLE (not a real price list)
    price_date: "2027-01-20"
  wheat_class: pastry
  manure_applied: false
  soil_test:
    sample_date: "2026-09-15"
    depth_top_cm: 0
    depth_bottom_cm: 15
    source: lab
    lab: SAMPLE lab (synthetic)
    values: []
expected:
  n_rate_kg_ha: 115.0
  n_total_kg: 2300.0
  split_rates_kg_ha: [115.0]
  confidence: low
  confidence_rules: [C1_NO_SOIL_TEST, C6_PLACEHOLDER_CONSTANT_USED]
  pk_note: PK_SOIL_TEST_RECOMMENDED
  phosphorus:
    outcome: not_calculated
  potassium:
    outcome: not_calculated
  soil_estimate: []
  reason: SAMPLE derived from the ca-on v2 pack; not an agronomist decision.
