# Common fertilizer types offered as a starting point on /products.
#
# STATUS: PLACEHOLDER. These are `ai_reviewed` proposals by cp-agronomist, entered from published
# documents (cited per row). They are NOT validated by a human agronomist and are not label facts
# for any product on sale.
# TODO(agronomist): validate grades and densities (docs/agronomist-todo.md, item 34).
#
# A preset only fills an editable form. It never creates or activates a product: a human saves
# the draft, then checks every value against the product label before activating it.
#
# Rules, enforced when the file is loaded (cloverproof_app/product_presets.py):
# - grades are label percentages: N and S elemental, P as P2O5, K as K2O
# - s: null means the source states no sulphur figure. It stays empty in the form, never 0.
# - density_kg_per_l: null on a liquid means no usable figure. It stays empty too.
# - generic types only: no brand, vendor or price fields.
