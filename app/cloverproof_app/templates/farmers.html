{% extends "base.html" %}
{% block title %}Farmers{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Farmers</h1>
  <a class="button" href="/farmers/new">Add farmer</a>
</div>
<form class="search" method="get" action="/farmers" role="search">
  <label for="q">Find farmer or field</label>
  <input id="q" name="q" type="search" value="{{ q }}" autocomplete="off"
         hx-get="/farmers" hx-trigger="input changed delay:300ms, search" hx-target="#farmer-rows" hx-swap="innerHTML">
</form>
<div id="farmer-rows">{% include "_farmer_rows.html" %}</div>
{% endblock %}
