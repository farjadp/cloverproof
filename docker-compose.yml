# Local development database only. Production runs on Railway (ADR 0004).
# Credentials come from .env; the defaults below are for local use only and are not secrets.
services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cloverproof}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/<major>/docker and expect the
      # volume at /var/lib/postgresql. New volume name: the old 17 volume (db-data) is not reused.
      - db-data-18:/var/lib/postgresql
    healthcheck:
      # TCP (-h): the init-phase temp server listens on the socket only, so this stays
      # unhealthy until PostGIS init scripts are done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U$${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data-18:
