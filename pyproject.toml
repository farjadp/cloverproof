[project]
name = "cloverproof"
version = "0.0.0"
description = "CloverProof monorepo root (uv workspace). Not a distributable package."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloverproof-engine",
    "cloverproof-app",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "app"]

[tool.uv.sources]
cloverproof-engine = { workspace = true }
cloverproof-app = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["website"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cloverproof_engine", "cloverproof_app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["engine/tests", "app/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
