name: ci

on:
  push:
    paths-ignore:
      - "website/**"
  pull_request:
    paths-ignore:
      - "website/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12 and locked dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test
