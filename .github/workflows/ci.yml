name: ci

on:
  push:
    paths-ignore:
      - "website/**"
  pull_request:
    paths-ignore:
      - "website/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12 and locked dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: WeasyPrint system libraries (proof PDF tests)
        run: bash .github/scripts/install_pdf_libs.sh

      - name: Test (CP_PDF_TESTS_REQUIRED=1, PDF render skips fail)
        env:
          CP_PDF_TESTS_REQUIRED: "1"
        run: make test

  db:
    # DB/auth integration tests against a real PostGIS. Same image as Railway.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          # CI-only ephemeral container, destroyed after the job; not a real credential.
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12 and locked dependencies
        run: make setup

      - name: WeasyPrint system libraries (proof PDF route tests)
        run: bash .github/scripts/install_pdf_libs.sh

      - name: DB tests (CP_DB_TESTS_REQUIRED=1, CP_PDF_TESTS_REQUIRED=1, skips fail)
        env:
          CP_PDF_TESTS_REQUIRED: "1"
        run: make db-test

  docker:
    # App image (Dockerfile): build only, never pushed. The smoke script starts its own
    # throwaway PostGIS, migrates it from the image, checks that a superuser login is
    # refused and that cp_app_login serves GET /healthz (docs/runbook-webapp.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build app image (no push)
        run: docker build -t cloverproof-app:ci .

      - name: Smoke test (migrate, refuse superuser, /healthz)
        run: .github/scripts/docker_smoke.sh cloverproof-app:ci
