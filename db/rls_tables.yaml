# Every table in schema `public`, with its RLS class (ADR 0008 §3, ciso criterion 0.3).
# app/tests/db/test_rls_catalog.py fails when a table is missing here, listed twice, or its
# catalog state (ENABLE / FORCE / policies) does not match its class.
#
#   tenant    has an organisation column; RLS enabled AND forced; restrictive org boundary
#             policy to cp_app plus permissive per-command policies (migration 0021).
#   identity  organisation, users, sessions, memberships, identity audit. Protected by grants
#             (ADR 0007) and SECURITY DEFINER functions today; RLS v1 in S3 (ADR 0008 §7,
#             needs the pre-auth lookup functions). Must have RLS DISABLED until then, so a
#             half-done change is visible in the catalog test.
#   website   written by cp_website only; RLS enabled (not forced) with an INSERT policy to
#             cp_website (migration 0022).
#   website_admin  website staff accounts, sessions and system log (migration 0024, ADR 0012/0014).
#             Grants to cp_website_admin + SECURITY DEFINER purge; RLS disabled; never
#             organisation-scoped (not part of identity RLS v1).
#   catalog   global reference data, deliberately NOT organisation-scoped: no organisation
#             column and no org boundary policy. RLS enabled AND forced; policies decide by
#             signed-in context and platform role (migration 0027, ADR 0008 §5).
#   global    no tenant data, no RLS: migration bookkeeping and PostGIS.
#
# organisation_column is the column the boundary policy compares with app_ctx_org().

tenant:
  farmer: organisation_id
  farm: organisation_id
  field: organisation_id
  season: organisation_id
  field_geometry_version: organisation_id
  soil_test: organisation_id
  soil_test_value: organisation_id
  soil_estimate: organisation_id
  crop_plan: organisation_id
  recommendation: organisation_id
  recommendation_line: organisation_id
  review: organisation_id
  application_log: organisation_id
  proof_document: organisation_id
  access_grant: owner_organisation_id

identity:
  - organisation
  - app_user
  - user_session
  - membership
  - admin_event

website:
  - pilot_request
  - site_event

website_admin:
  - website_user
  - website_user_recovery_code
  - website_session
  - website_one_time_token
  - website_rate_limit
  - website_log
  - website_job_run
  - website_secret

catalog:
  - fertilizer_product

global:
  - schema_migrations
  - spatial_ref_sys
